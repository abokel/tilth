modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Soil hydraulics after Saxton & Rawls (2006); crop water stress after FAO-56; growth stages after the BBCH scale."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: recipe and mechanic pages in JEI.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

# Optional: the Tilth Field Guide book.
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
